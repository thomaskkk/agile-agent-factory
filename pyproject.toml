[project]
name = "agile-agent-factory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.104.0",
    "openai>=1.0.0",
    "langsmith>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "responses>=0.25.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-cli[inmem]>=0.4.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agile_agent_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
